[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-figure-studio"
version = "0.1.0"
description = "A reproducible Matplotlib system for mathematical modeling figures."
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pypdf>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples/outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools]
packages = ["figure_studio"]
